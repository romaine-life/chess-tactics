{{- if .Values.externalSecret }}
# Syncs this app's OAuth secrets from Key Vault into a k8s Secret named `chess-tactics-oauth`,
# mounted as env in deployment.yaml. Source of truth is Key Vault; external-secrets-operator
# refreshes the k8s Secret on the interval below.
#
# The same shape the auth service uses for `auth-oauth`. Both of these were hand-created with
# `kubectl create secret` first, which works and leaves nothing declaring where the value came
# from, nothing to recreate it in a rebuilt cluster, and no record that it exists at all.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chess-tactics-oauth
  namespace: {{ include "chess-tactics.namespace" . }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName | quote }}
    kind: {{ .Values.externalSecret.storeKind | default "ClusterSecretStore" | quote }}
  target:
    name: chess-tactics-oauth
    creationPolicy: Owner
    # Retain, so a chart mistake cannot delete the encryption key out from under every live
    # session. Losing it is not recoverable by re-syncing if the Key Vault entry is also gone.
    deletionPolicy: Retain
  data:
    # Encrypts the OAuth tokens held in `auth_sessions` (ADR-0576). The session cookie's token is
    # hashed; these cannot be, because the backend must present them to renew.
    #
    # ROTATING THIS ENDS EVERY LIVE SESSION: rows encrypted under the old key stop being
    # renewable and are deleted on next use. That is the honest outcome, not a bug.
    - secretKey: AUTH_TOKEN_ENCRYPTION_KEY
      remoteRef:
        key: chess-tactics-token-encryption-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    # This app's OAuth client secret. A BFF is a confidential client
    # (draft-ietf-oauth-browser-based-apps-26 §6.1.3.1). The matching half is synced into the auth
    # service's `auth-oauth` from the SAME Key Vault entry name, so the two cannot drift; rotate
    # by setting the Key Vault value once and re-rolling both pods.
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: chess-tactics-oidc-client-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
