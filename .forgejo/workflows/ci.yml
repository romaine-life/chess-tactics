name: CI

# One workflow for pull requests, merges to main and manual runs (ADR-0644). A pull request that
# changes only Markdown skips the backend, frontend and image jobs; `docs` runs the guards that
# read Markdown on every run. A pull request builds its validation image in `image`, a push to
# main builds and deploys in `deploy`, and a dispatch runs both; a dispatch publishes to prod only
# when it runs main with no `git_ref`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref or commit SHA to build without publishing to prod. Leave blank to build the dispatch revision, which publishes to prod when it is main."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

# Pushes and dispatches keep Build and Deploy's shared group, so releases run one at a time. Nothing
# is cancelled: `backend-tests` starts a PostgreSQL container, which a cancelled job leaves running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'build-and-deploy' }}
  cancel-in-progress: false

# Every job here runs `npm ci` in frontend/, and `onnxruntime-node`'s install script downloads its
# CUDA execution provider from a GitHub release whenever the platform is Linux/x64 and the .so is
# absent — which is every runner. That ~200MB fetch failed three jobs in one afternoon (ECONNRESET
# twice, 503 once), each passing on a blind re-run, and it is pure waste: nothing in this repo
# imports onnxruntime-node at all. It arrives as a required dependency of
# @huggingface/transformers, whose only consumer is a browser web worker running the 'webgpu' |
# 'wasm' backends through onnxruntime-web. Every other binary is bundled in the npm tarball, so
# skipping leaves the package importable on CPU; the CUDA EP needs an NVIDIA GPU no runner has.
# The env var is read ahead of npm config on purpose — the equivalent .npmrc key is an unknown npm
# config, so it warns on every npm command in frontend/ and says it stops working in the next major.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      # Only Markdown and LICENSE count as documentation: docs/ also holds JSON, Python and text
      # that the frontend tests and scripts read.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...HEAD")
          if grep -qvE '\.md$|^LICENSE$' <<< "$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          fi

  # The frontend gate's guards that read Markdown, run alone so a Markdown-only change is still
  # checked; they need Node and git, not node_modules.
  docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: "22"

      - name: Check docs
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/check-no-committed-media.mjs
          node scripts/check-doc-links.mjs
          node --test scripts/check-doc-links.node-test.mjs
          node scripts/check-decision-log-index.mjs
          node --test scripts/check-decision-log-index.node-test.mjs
          node scripts/check-adr-numbers.mjs
          node --test scripts/check-adr-numbers.node-test.mjs

  backend-tests:
    name: Test backend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            packages/board-render/package-lock.json

      - name: Start isolated PostgreSQL
        id: postgres
        run: |
          set -euo pipefail
          port="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          id="$(docker run -d --network host -e PGPORT="$port" -e POSTGRES_USER=chess_tactics -e POSTGRES_PASSWORD=chess_tactics -e POSTGRES_DB=chess_tactics artifacts.home.romaine.life/dockerhub/library/postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do
            if docker exec "$id" pg_isready -U chess_tactics; then exit 0; fi
            sleep 2
          done
          docker logs "$id"
          exit 1

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgres://chess_tactics:chess_tactics@localhost:${{ steps.postgres.outputs.port }}/chess_tactics
        run: |
          npm ci
          npm test

      - name: Remove isolated PostgreSQL
        if: always() && steps.postgres.outputs.id != ''
        run: docker rm -f '${{ steps.postgres.outputs.id }}'

  frontend-checks:
    name: Check frontend contracts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.git_ref || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/board-render/package-lock.json

      - name: Check frontend contracts
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test immutable-image release contract
        run: node --test scripts/immutable-image-release.test.mjs

  # The validation image for pull requests and dispatches; a push to main builds its image in
  # `deploy` instead.
  image:
    name: Test and build app image
    if: github.event_name != 'push'
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    # PR validation images and manual prebuilds use the dev identity. Only the deploy job, on a
    # push to main, may enter the production environment.
    enable-openid-connect: true
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    env:
      REGISTRY: romainecr.azurecr.io
      IMAGE: chess-tactics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve image source ref
        id: source
        env:
          INPUT_REF: ${{ inputs.git_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -n "${PR_HEAD_SHA}" ]; then
            full_sha="${PR_HEAD_SHA}"
          elif [ -n "${INPUT_REF}" ]; then
            if full_sha="$(git rev-parse --verify "${INPUT_REF}^{commit}" 2>/dev/null)"; then
              :
            elif git show-ref --verify --quiet "refs/remotes/origin/${INPUT_REF}"; then
              full_sha="$(git rev-parse "refs/remotes/origin/${INPUT_REF}^{commit}")"
            elif git show-ref --verify --quiet "refs/tags/${INPUT_REF}"; then
              full_sha="$(git rev-parse "refs/tags/${INPUT_REF}^{commit}")"
            else
              echo "::error::Unable to resolve git_ref '${INPUT_REF}' to a commit."
              exit 1
            fi
          else
            full_sha="$(git rev-parse HEAD)"
          fi
          git checkout --detach "$full_sha"
          echo "Resolved image source -> ${full_sha}"
          echo "sha=${full_sha}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=artifacts.home.romaine.life/dockerhub/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      # Same-repo PRs and workflow dispatches publish the content fingerprint
      # image used by Glimmung test slots. Production independently builds the
      # merged main revision; PR images are validation artifacts, not release
      # candidates that main must promote.
      - uses: romaine-life/pipeline-templates/actions/azure-cli@main

      - name: Azure Login
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Login to ACR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: az acr login --name romainecr

      - name: Compute image fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          scripts/image-fingerprint.sh \
            --image app \
            --dockerfile Dockerfile \
            --context . \
            --paths 'Dockerfile .dockerignore backend frontend packages/board-render' \
            --platform linux/amd64

      - name: Check existing image tag
        id: image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.fingerprint.outputs.proof_tag }}"
          if az acr repository show-tags \
              --name romainecr \
              --repository "${IMAGE}" \
              --query "[?@=='${tag}'] | [0]" \
              --output tsv | grep -qx "${tag}"; then
            echo "target_exists=true" >>"${GITHUB_OUTPUT}"
            echo "Found reusable image ${REGISTRY}/${IMAGE}:${tag}"
          else
            echo "target_exists=false" >>"${GITHUB_OUTPUT}"
            echo "No image found for app fingerprint ${{ steps.fingerprint.outputs.fingerprint }}"
          fi

      - name: Build and push image
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.image.outputs.target_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          network: host
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.fingerprint.outputs.proof_tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app,mode=max

      - name: Tag app image by commit
        # Glimmung resolves the CI-proven image for a pushed ref through this
        # commit-addressed alias. Production does not consume this alias.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          canonical="${{ steps.fingerprint.outputs.proof_tag }}"
          commit_tag="sha-${{ steps.source.outputs.sha }}"
          az acr import --name romainecr \
            --source "${REGISTRY}/${IMAGE}:${canonical}" \
            --image "${IMAGE}:${commit_tag}" \
            --force
          echo "Tagged ${REGISTRY}/${IMAGE}:${commit_tag} -> ${canonical}"

      - name: Build image without pushing (fork PRs)
        # Fork PRs stay build-only: no ACR login, no push. This preserves the
        # original fork-safe behavior of this workflow verbatim.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@v7
        with:
          network: host
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A push to main, or a dispatch of main with no `git_ref`, builds the revision and deploys it;
  # any other dispatch builds and locks its ref without publishing. It waits for `image`, which on
  # a dispatch pushes the same fingerprint tag this job locks, and which is skipped only on a push.
  deploy:
    name: Build merged image and pin Helm digest
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request'
      && (github.event_name == 'workflow_dispatch' || vars.ARM_CLIENT_ID != '')
      && needs.changes.result == 'success'
      && needs.backend-tests.result == 'success'
      && needs.frontend-checks.result == 'success'
      && (needs.image.result == 'success' || (github.event_name == 'push' && needs.image.result == 'skipped')) }}
    needs: [changes, backend-tests, frontend-checks, image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      # Resolve the merged PR (title/number/url) for the built commit — surfaced in
      # Settings → About. See the "Resolve build metadata" step.
      pull-requests: read
    enable-openid-connect: true
    environment: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.git_ref && 'prod' || 'dev' }}
    env:
      REGISTRY: romainecr.azurecr.io
      IMAGE: chess-tactics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Dispatch may inspect arbitrary same-repo revisions. Do not leave a
          # write-capable token in their Git config; the gated publish step
          # authenticates only after all target-controlled code has finished.
          persist-credentials: false

      - name: Resolve requested ref
        env:
          INPUT_REF: ${{ inputs.git_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper='!f() { echo username=forgejo-actions; echo "password=$GH_TOKEN"; }; f' fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          target_ref="${INPUT_REF:-$GITHUB_SHA}"
          if full_sha="$(git rev-parse --verify "${target_ref}^{commit}" 2>/dev/null)"; then
            :
          elif git show-ref --verify --quiet "refs/remotes/origin/${target_ref}"; then
            full_sha="$(git rev-parse "refs/remotes/origin/${target_ref}^{commit}")"
          elif git show-ref --verify --quiet "refs/tags/${target_ref}"; then
            full_sha="$(git rev-parse "refs/tags/${target_ref}^{commit}")"
          else
            echo "::error::Unable to resolve git_ref '${target_ref}' to a commit."
            exit 1
          fi
          git checkout --detach "$full_sha"
          echo "Resolved ${target_ref} -> ${full_sha}"

      - name: Resolve build metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="$(git rev-parse --short HEAD)"
          # Resolve the merged-to-main PR whose merge commit is this revision
          # for build provenance. Deployment identity comes from the checked-out
          # content fingerprint and locked registry digest, not PR metadata.
          prs_json="$(curl -sS --config - "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/commits/${sha}/pull" <<EOF | jq -s 'map(select(type == "object"))'
          header = "Authorization: token ${GH_TOKEN}"
          EOF
          )"
          pr_json="$(printf '%s' "$prs_json" | jq -c --arg sha "$sha" \
            '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | if length == 1 then .[0] else {} end')"
          pr_number="$(printf '%s' "$pr_json" | jq -r '.number // empty')"
          pr_title="$(printf '%s' "$pr_json" | jq -r '.title // empty')"
          pr_url="$(printf '%s' "$pr_json" | jq -r '.html_url // empty')"
          # Fallback for direct pushes / dispatch with no API association: parse a
          # trailing "(#NNN)" from the commit subject (our squash-merge convention).
          if [ -z "$pr_number" ]; then
            subj="$(git log -1 --pretty=%s)"
            pr_number="$(printf '%s' "$subj" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')"
            if [ -n "$pr_number" ]; then
              pr_title="$(printf '%s' "$subj" | sed 's/ (#[0-9][0-9]*)$//')"
              pr_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pulls/${pr_number}"
            fi
          fi
          {
            echo "commit=${short}"
            echo "pr_number=${pr_number}"
            echo "pr_url=${pr_url}"
          } >> "$GITHUB_OUTPUT"
          # Title is free text — write it with a heredoc so quotes/newlines survive.
          {
            echo "pr_title<<__META_EOF__"
            printf '%s\n' "$pr_title"
            echo "__META_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Build metadata: ${short} — ${pr_title:-(no title)} (#${pr_number:-?})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: romaine-life/pipeline-templates/actions/setup-node@main
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            packages/board-render/package-lock.json

      - uses: romaine-life/pipeline-templates/actions/azure-cli@main

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.ARM_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.ARM_SUBSCRIPTION_ID }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=artifacts.home.romaine.life/dockerhub/moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Compute release version (patch) — sourced from the prod deploy branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.git_ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Version-of-record lives on the long-lived `prod` DEPLOY branch (its
          # k8s/Chart.yaml appVersion), NOT on main — so a release never commits back to
          # main and main can stay branch-protected. Take the greater of prod's current
          # version and main's package.json (the latter is the FLOOR for a hand MINOR/MAJOR
          # bump made in a normal PR), then patch-bump it.
          #
          # Runs BEFORE the fingerprint + docker build on purpose: the bumped version is
          # baked into the image that deploys (Settings → About → Build) AND changes the
          # content fingerprint, so a new version always yields a fresh image tag. The bake
          # is EPHEMERAL — written into this checkout's package.json for the build only,
          # never committed to main. It's committed to prod (appVersion) further below.
          git -c credential.helper='!f() { echo username=forgejo-actions; echo "password=$GH_TOKEN"; }; f' fetch --force origin '+refs/heads/prod:refs/remotes/origin/prod'
          prod_ver="$(git show origin/prod:k8s/Chart.yaml 2>/dev/null \
            | sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' | head -1)"
          base_ver="$(node -p "require('./frontend/package.json').version")"
          backend_ver="$(node -p "require('./backend/package.json').version")"
          board_render_ver="$(node -p "require('./packages/board-render/package.json').version")"
          floor="$(printf '%s\n%s\n%s\n%s\n' "${prod_ver:-0.0.0}" "${base_ver}" "${backend_ver}" "${board_render_ver}" | sort -V | tail -1)"
          IFS=. read -r MA MI PA <<<"${floor}"
          new_version="${MA}.${MI}.$((PA + 1))"
          # Bake into THIS checkout only, for the build; not committed to main.
          (cd frontend && npm version "${new_version}" --no-git-tag-version --allow-same-version >/dev/null)
          (cd backend  && npm version "${new_version}" --no-git-tag-version --allow-same-version >/dev/null)
          (cd packages/board-render && npm version "${new_version}" --no-git-tag-version --allow-same-version >/dev/null)
          echo "APP_VERSION=${new_version}" >> "$GITHUB_ENV"
          echo "Release v${new_version} (prod ${prod_ver:-none} / package floors ${base_ver}, ${backend_ver}, ${board_render_ver})" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute image fingerprint
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          scripts/image-fingerprint.sh \
            --image app \
            --dockerfile Dockerfile \
            --context . \
            --paths 'Dockerfile .dockerignore backend frontend packages/board-render' \
            --platform linux/amd64 \
            | tee "${output}"
          tag="$(awk -F= '$1 == "proof_tag" { print $2 }' "${output}")"
          test -n "${tag}" || { echo "::error::image fingerprint did not emit proof_tag"; exit 1; }
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "Built ref $(git rev-parse HEAD) as ${REGISTRY}/${IMAGE}:${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to ACR
        run: az acr login --name romainecr

      - name: Check existing image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          digest="$(az acr repository show \
            --name romainecr \
            --image "${IMAGE}:${TAG}" \
            --query digest \
            --output tsv 2>/dev/null || true)"
          if [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "target_exists=true" >>"${GITHUB_OUTPUT}"
            echo "digest=${digest}" >>"${GITHUB_OUTPUT}"
            echo "Found reusable image ${REGISTRY}/${IMAGE}:${TAG}@${digest}"
          elif [[ -n "${digest}" ]]; then
            echo "::error::Registry returned an invalid digest for ${REGISTRY}/${IMAGE}:${TAG}: ${digest}"
            exit 1
          else
            echo "target_exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build and push merged image
        id: build
        if: steps.image.outputs.target_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          network: host
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}-build-cache:app,mode=max

      - name: Capture immutable deployment image
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          expected_digest="${EXISTING_DIGEST:-${BUILT_DIGEST}}"
          if [[ ! "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The merged-image build did not resolve an immutable manifest digest."
            exit 1
          fi

          # Resolve the tag before locking it so we never make an unexpected
          # digest immutable and then publish it to prod.
          tag_json="$(az acr repository show \
            --name romainecr \
            --image "${IMAGE}:${TAG}" \
            --output json)"
          canonical_digest="$(printf '%s' "${tag_json}" | jq -r '.digest // empty')"
          if [[ "${canonical_digest}" != "${expected_digest}" ]]; then
            echo "::error::ACR resolved ${REGISTRY}/${IMAGE}:${TAG} to ${canonical_digest:-nothing}, expected ${expected_digest}."
            exit 1
          fi

          # ACR tracks tag and manifest retention independently. Lock both the
          # readable fingerprint tag and the content-addressed manifest that
          # production references.
          az acr repository update \
            --name romainecr \
            --image "${IMAGE}:${TAG}" \
            --write-enabled false \
            --delete-enabled false >/dev/null
          az acr repository update \
            --name romainecr \
            --image "${IMAGE}@${canonical_digest}" \
            --write-enabled false \
            --delete-enabled false >/dev/null

          tag_json="$(az acr repository show \
            --name romainecr \
            --image "${IMAGE}:${TAG}" \
            --output json)"
          manifest_json="$(az acr repository show \
            --name romainecr \
            --image "${IMAGE}@${canonical_digest}" \
            --output json)"
          tag_digest="$(printf '%s' "${tag_json}" | jq -r '.digest // empty')"
          tag_write_enabled="$(printf '%s' "${tag_json}" | jq -r '.changeableAttributes.writeEnabled')"
          tag_delete_enabled="$(printf '%s' "${tag_json}" | jq -r '.changeableAttributes.deleteEnabled')"
          manifest_digest="$(printf '%s' "${manifest_json}" | jq -r '.digest // empty')"
          manifest_write_enabled="$(printf '%s' "${manifest_json}" | jq -r '.changeableAttributes.writeEnabled')"
          manifest_delete_enabled="$(printf '%s' "${manifest_json}" | jq -r '.changeableAttributes.deleteEnabled')"
          if [[ "${tag_digest}" != "${expected_digest}" \
            || "${manifest_digest}" != "${expected_digest}" \
            || "${tag_write_enabled}" != "false" \
            || "${tag_delete_enabled}" != "false" \
            || "${manifest_write_enabled}" != "false" \
            || "${manifest_delete_enabled}" != "false" ]]; then
            echo "::error::ACR did not lock both ${REGISTRY}/${IMAGE}:${TAG} and ${REGISTRY}/${IMAGE}@${expected_digest}."
            exit 1
          fi

          image_ref="${REGISTRY}/${IMAGE}@${canonical_digest}"
          echo "IMAGE_DIGEST=${canonical_digest}" >> "$GITHUB_ENV"
          echo "DEPLOY_IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"
          echo "Built merged ref $(git rev-parse HEAD) and pinned ${image_ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish tag + version to the prod deploy branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.git_ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ steps.meta.outputs.pr_title }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          PR_URL: ${{ steps.meta.outputs.pr_url }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          # DEPLOY STATE goes to the long-lived orphan `prod` branch, never main. prod carries
          # ONLY k8s/, so we sync main's chart onto it (template/values edits from PRs flow
          # through), then pin the registry-locked image digest + appVersion + build provenance, and
          # commit there. ArgoCD tracks `prod`. main takes zero bot commits → it stays protected.
          # No [skip ci] needed: this workflow triggers on main, so a prod push starts nothing.
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions@noreply.romaine.life"
          git -c credential.helper='!f() { echo username=forgejo-actions; echo "password=$GH_TOKEN"; }; f' fetch --force origin '+refs/heads/prod:refs/remotes/origin/prod'
          git worktree add --detach prod-deploy origin/prod
          rm -rf prod-deploy/k8s
          cp -r k8s prod-deploy/k8s
          # `tag` accepts a complete image ref when it contains `/`; pinning the
          # digest keeps Argo and the trainer on the exact CI-built manifest.
          sed -i "s|^  tag: .*|  tag: \"${DEPLOY_IMAGE_REF}\"|" prod-deploy/k8s/values.yaml
          grep -qx "  tag: \"${DEPLOY_IMAGE_REF}\"" prod-deploy/k8s/values.yaml \
            || { echo "::error::prod values.yaml image digest was not set"; exit 1; }
          sed -i "s|^appVersion: .*|appVersion: \"${APP_VERSION}\"|" prod-deploy/k8s/Chart.yaml
          grep -qx "appVersion: \"${APP_VERSION}\"" prod-deploy/k8s/Chart.yaml \
            || { echo "::error::prod Chart.yaml appVersion was not set"; exit 1; }
          node scripts/write-build-info.mjs prod-deploy/k8s/values.yaml
          git -C prod-deploy add k8s
          if git -C prod-deploy diff --cached --quiet; then
            echo "No deploy change to publish to prod"
          else
            git -C prod-deploy commit -m "deploy: v${APP_VERSION} — image ${IMAGE_DIGEST}"
            git -C prod-deploy -c credential.helper='!f() { echo username=forgejo-actions; echo "password=$GH_TOKEN"; }; f' push origin HEAD:prod
          fi
          git worktree remove --force prod-deploy

      - name: Cut source release on Forgejo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.git_ref
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg tag "v${APP_VERSION}" --arg sha "$GITHUB_SHA" --arg image "$DEPLOY_IMAGE_REF" \
            '{tag_name:$tag,target_commitish:$sha,name:$tag,body:("Source release; production image: `" + $image + "`.\n\nhttps://openproject.home.romaine.life/wp/FORGEJO-3"),draft:false,prerelease:false}' > release.json
          curl -fsS --config - --request POST --data-binary @release.json \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" <<EOF | jq '{tag_name,html_url}'
          header = "Authorization: token ${TOKEN}"
          header = "Content-Type: application/json"
          EOF
