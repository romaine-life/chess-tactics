name: Checks

# The check no suite runs on its own: the guards that read Markdown (committed media, doc links,
# the decision-log index, ADR numbers), run whenever a PR changes Markdown or the guards, so a
# documentation-only PR is checked without the frontend and backend suites. The web-app suite
# runs them again with the rest of the frontend's lint (ADR-0645).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE...HEAD" | grep -qE '\.md$|^frontend/scripts/check-(no-committed-media|doc-links|decision-log-index|adr-numbers)|^\.forgejo/workflows/checks\.yml$'; then echo run=true >> "$GITHUB_OUTPUT"; fi
      - uses: romaine-life/pipeline-templates/actions/setup-node@main
        if: steps.diff.outputs.run == 'true'
        with:
          node-version: "22"
      - name: Check docs
        if: steps.diff.outputs.run == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/check-no-committed-media.mjs
          node scripts/check-doc-links.mjs
          node --test scripts/check-doc-links.node-test.mjs
          node scripts/check-decision-log-index.mjs
          node --test scripts/check-decision-log-index.node-test.mjs
          node scripts/check-adr-numbers.mjs
          node --test scripts/check-adr-numbers.node-test.mjs
