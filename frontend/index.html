<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Tactics</title>
    <link
      rel="preload"
      href="/assets/fonts/advance-wars-2-gba/advance-wars-2-gba.otf"
      as="font"
      type="font/otf"
      crossorigin
    >
    <style>
      @font-face {
        font-family: "Advance Wars 2 GBA";
        src: url("/assets/fonts/advance-wars-2-gba/advance-wars-2-gba.otf") format("opentype");
        font-display: block;
      }

      html,
      body {
        background: #05090d;
        color: #dbe7ea;
        margin: 0;
      }

      .app-bootstrap-status {
        align-items: center;
        background: #05090d;
        color: #dbe7ea;
        display: flex;
        font-family: "Advance Wars 2 GBA", sans-serif;
        /* The house font's design brick is em/16, so it only lands on whole pixels at
           multiples of 16px. 19px gave a 1.1875px brick — the very first string the
           player sees was drawn off the grid. */
        font-size: 16px;
        word-spacing: .5px;
        inset: 0;
        justify-content: center;
        letter-spacing: 0.02em;
        opacity: 1;
        position: fixed;
        transition: opacity 350ms linear;
        visibility: hidden;
        z-index: 1000;
      }

      .app-bootstrap-status.is-font-ready {
        visibility: visible;
      }

      .app-bootstrap-status.is-exiting {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="loading-bootstrap">
    <main
      id="app-bootstrap-status"
      class="app-bootstrap-status is-font-pending"
      role="status"
      aria-live="polite"
    >Loading...</main>
    <main class="shell">
      <!-- The title bar is the React app-shell bar (src/ui/shell/AppTitleBar), rendered
           inside #root and fixed at the top; the old static topbar + its auth wiring were
           retired and deleted when every screen moved to the shell bar. -->
      <div id="root" class="app-root"></div>
    </main>

    <script>
      (() => {
        const status = document.getElementById('app-bootstrap-status');
        const fontReady = document.fonts
          .load('19px "Advance Wars 2 GBA"', 'Loading...')
          .then(() => {
            if (!document.fonts.check('19px "Advance Wars 2 GBA"', 'Loading...')) {
              throw new Error('bootstrap font unavailable');
            }
            status?.classList.remove('is-font-pending');
            status?.classList.add('is-font-ready');
          });
        window.__ctBootstrapFontReady = fontReady;
        fontReady.catch(() => {});

        const path = window.location.pathname.replace(/\/+$/, '') || '/';
        const home = path === '/' || path === '/main-menu' || path === '/menu-next';
        window.__ctBootstrapScene = home
          ? fetch(`/api/app-bootstrap-scene?path=${encodeURIComponent(path)}`, {
              cache: 'no-cache',
              credentials: 'same-origin',
              priority: 'high',
            })
              .then((response) => {
                if (!response.ok) throw new Error(`bootstrap scene ${response.status}`);
                return response.json();
              })
              .then((projection) => {
                const media = projection?.scene?.background;
                if (!media?.immutableUrl) return projection;
                const preload = document.createElement('link');
                preload.rel = 'preload';
                preload.as = 'image';
                preload.href = media.immutableUrl;
                if (media.mediaType) preload.type = media.mediaType;
                preload.setAttribute('fetchpriority', 'high');
                document.head.appendChild(preload);
                const image = new Image();
                image.decoding = 'async';
                image.fetchPriority = 'high';
                window.__ctBootstrapBackground = new Promise((resolve, reject) => {
                  image.onload = () => {
                    const decoded = image.decode?.();
                    if (decoded) decoded.then(() => resolve(media), reject);
                    else resolve(media);
                  };
                  image.onerror = reject;
                });
                image.src = media.immutableUrl;
                return projection;
              })
              .catch(() => null)
          : Promise.resolve(null);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
